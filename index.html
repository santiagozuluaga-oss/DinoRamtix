<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DinoRamtix</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>body{margin:0;background:#f5f6f8;font:15px Arial;color:#111}*{box-sizing:border-box}button,input,textarea,select{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.p{background:#0095f6;color:#fff}.g{background:#e9edf1}.d{background:#ffe5e5;color:#a00}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin:12px 0}.hidden{display:none!important}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.tabs{display:flex;gap:8px;margin:12px 0}.tabs>*{flex:1}input,textarea,select{width:100%;padding:12px;border:1px solid #ccd0d5;border-radius:9px;margin:6px 0}textarea{min-height:80px}.muted{color:#70757d}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffcf70,#e1306c,#833ab4);color:#fff;font-weight:bold;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.verified{background:#168df7;color:white;border-radius:50%;padding:2px 5px;font-size:11px}.media{width:100%;max-height:720px;object-fit:contain;background:#111;border-radius:12px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px}.profile{display:flex;gap:20px;align-items:center}.profile .avatar{width:90px;height:90px;font-size:30px}.guest{background:#fff7d8;padding:11px;border-radius:10px}.feed{max-width:680px;margin:auto}.avatarPicker{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:8px 0;border:3px solid #eee}.avatarPicker img{width:100%;height:100%;object-fit:cover}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="card" style="border-radius:0;margin:0"><div class="wrap" style="padding:0"><b style="font-size:24px">DinoRamtix 🦖</b></div></header><main class="wrap"><section id="auth" class="card" style="max-width:430px;margin:70px auto"><h1>DinoRamtix</h1><div class="tabs"><button class="p" onclick="mode='login';tabs()">Iniciar sesión</button><button class="g" onclick="mode='signup';tabs()">Registrarme</button></div><input id="email" type="email" placeholder="Correo electrónico"><input id="pass" type="password" placeholder="Contraseña"><input id="user" class="hidden" placeholder="Nombre de usuario"><button id="authBtn" class="p" style="width:100%" onclick="auth()">Iniciar sesión</button><button class="g" style="width:100%;margin-top:8px" onclick="guest()">Continuar como invitado</button><p id="msg" class="muted"></p></section><section id="app" class="hidden"><div id="guest" class="guest hidden">👋 Estás como invitado. Puedes ver contenido; inicia sesión para seguir, publicar y editar.</div><div class="tabs"><button class="g" onclick="go('feed')">Inicio</button><button class="g" onclick="go('explore')">Explorar</button><button class="g" onclick="go('reels')">Reels</button><button class="p" onclick="need('create')">＋ Publicar</button><button class="g" onclick="go('me')">Perfil</button></div><section id="feed"><div id="feedList" class="feed"></div></section><section id="explore" class="hidden"><div class="card"><h2>Explorar</h2><input id="search" placeholder="Buscar usuario..." oninput="people()"></div><div id="peopleList"></div></section><section id="reels" class="hidden"><div id="reelForm" class="card"><h2>Nuevo Reel</h2><input id="rv" placeholder="URL directa del video"><input id="rc" placeholder="Descripción"><button class="p" onclick="reel()">Publicar Reel</button></div><div id="reelList"></div></section><section id="create" class="hidden"><div class="card"><h2>Nueva publicación</h2><input id="pv" placeholder="URL directa de imagen o video"><select id="pt"><option value="image">Imagen</option><option value="video">Video</option></select><textarea id="pc" placeholder="Descripción"></textarea><button class="p" onclick="post()">Publicar</button></div></section><section id="me" class="hidden"><div id="meBox"></div></section><section id="profile" class="hidden"><div id="profileBox"></div></section><button class="d" onclick="logout()">Cerrar sesión</button></section></main><script>const db=supabase.createClient(DINORAMTIX_CONFIG.supabaseUrl,DINORAMTIX_CONFIG.supabasePublishableKey);let me=null,guestMode=false,mode='login';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function tabs(){$('user').classList.toggle('hidden',mode!='signup');$('authBtn').textContent=mode=='signup'?'Crear cuenta':'Iniciar sesión'}function av(u){return `<div class="avatar">${u?.avatar_url?`<img src="${esc(u.avatar_url)}">`:esc((u?.username||'?')[0].toUpperCase())}</div>`}function ver(u){return u?.verified?' <span class="verified">✓</span>':''}async function auth(){let email=$('email').value.trim(),password=$('pass').value,username=$('user').value.trim();if(!email||!password||(mode=='signup'&&!username))return $('msg').textContent='Completa todos los campos.';let r=mode=='login'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{data:{username}}});if(r.error)return $('msg').textContent=r.error.message;if(!r.data.session)return $('msg').textContent='Cuenta creada. Revisa Email Confirmations si no entra automáticamente.';me=r.data.user;start()}async function start(){guestMode=false;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('guest').classList.add('hidden');await db.from('profiles').upsert({id:me.id,username:me.user_metadata?.username||'usuario_'+me.id.slice(0,8)},{onConflict:'id'});go('feed')}function guest(){guestMode=true;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('guest').classList.remove('hidden');$('reelForm').classList.add('hidden');go('feed')}function need(id){if(guestMode){alert('Inicia sesión para usar esta función');return}go(id)}function go(id){['feed','explore','reels','create','me','profile'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id=='feed')feed();if(id=='explore')people();if(id=='reels')reels();if(id=='me')my()}async function feed(){let{data,error}=await db.from('posts').select('id,user_id,caption,media_url,media_type,likes_count,created_at,profiles(username,verified,avatar_url)').order('created_at',{ascending:false}).limit(50);$('feedList').innerHTML=error?`<div class="card">${esc(error.message)}</div>`:(data||[]).map(p=>`<article class="card"><div class="row">${av(p.profiles)}<div class="grow"><b>${esc(p.profiles?.username||'Usuario')}${ver(p.profiles)}</b></div><button class="g" onclick="profile('${p.user_id}')">Perfil</button></div>${p.media_type=='video'?`<video class="media" src="${esc(p.media_url)}" controls></video>`:`<img class="media" src="${esc(p.media_url)}">`}<p>${esc(p.caption)}</p><button class="g" onclick="like('${p.id}')">❤️ ${p.likes_count||0}</button></article>`).join('')||'<div class="card">No hay publicaciones.</div>'}async function people(){let q=$('search')?.value.trim()||'',x=db.from('profiles').select('*').order('followers_count',{ascending:false}).limit(50);if(q)x=x.ilike('username','%'+q+'%');let{data,error}=await x;$('peopleList').innerHTML=error?`<div class="card">${esc(error.message)}</div>`:(data||[]).map(u=>`<div class="card row">${av(u)}<div class="grow"><b>${esc(u.username)}${ver(u)}</b><div class="muted">${u.followers_count||0} seguidores</div></div><button class="p" onclick="profile('${u.id}')">Ver perfil</button></div>`).join('')||'<div class="card">No encontramos usuarios.</div>'}async function profile(id){let{data:u,error}=await db.from('profiles').select('*').eq('id',id).single();if(error)return alert(error.message);['feed','explore','reels','create','me'].forEach(x=>$(x).classList.add('hidden'));$('profile').classList.remove('hidden');let follow='';if(!guestMode&&me.id!=id){let f=await db.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',id).maybeSingle();follow=`<button class="${f.data?'g':'p'}" onclick="toggleFollow('${id}',${!!f.data})">${f.data?'Siguiendo':'Seguir'}</button>`}$('profileBox').innerHTML=`<div class="card"><div class="profile">${av(u)}<div class="grow"><h2>${esc(u.username)}${ver(u)}</h2><div>${u.followers_count||0} seguidores · ${u.following_count||0} siguiendo</div><p>${esc(u.bio||'')}</p>${follow}</div></div></div><h3>Publicaciones</h3><div id="pgrid" class="grid"></div>`;let{data:ps}=await db.from('posts').select('media_url,media_type').eq('user_id',id).order('created_at',{ascending:false});$('pgrid').innerHTML=(ps||[]).map(p=>p.media_type=='video'?`<video src="${esc(p.media_url)}" controls></video>`:`<img src="${esc(p.media_url)}">`).join('')||'<p>Sin publicaciones.</p>'}async function toggleFollow(id,following){let r=following?await db.from('follows').delete().eq('follower_id',me.id).eq('following_id',id):await db.from('follows').insert({follower_id:me.id,following_id:id});if(r.error)return alert(r.error.message);profile(id)}async function my(){let{data:u,error}=await db.from('profiles').select('*').eq('id',me.id).single();if(error)return alert(error.message);$('meBox').innerHTML=`<div class="card"><div class="profile">${av(u)}<div class="grow"><h2>${esc(u.username)}${ver(u)}</h2><div>${u.followers_count||0} seguidores · ${u.following_count||0} siguiendo</div></div></div><button class="p" style="margin-top:15px" onclick="editProfile()">Editar perfil</button></div><h3>Mis publicaciones</h3><div id="mygrid" class="grid"></div>`;let{data:ps}=await db.from('posts').select('media_url,media_type').eq('user_id',me.id).order('created_at',{ascending:false});$('mygrid').innerHTML=(ps||[]).map(p=>p.media_type=='video'?`<video src="${esc(p.media_url)}" controls></video>`:`<img src="${esc(p.media_url)}">`).join('')||'<p>Sin publicaciones.</p>'}async function editProfile(){let{data:u,error}=await db.from('profiles').select('*').eq('id',me.id).single();if(error)return alert(error.message);$('meBox').innerHTML=`<div class="card"><h2>Editar perfil</h2><div class="avatarPicker">${u.avatar_url?`<img id="avatarPreview" src="${esc(u.avatar_url)}">`:'<div class="avatar" style="width:100%;height:100%">?</div>'}</div><label>Foto de perfil</label><input id="avatarFile" type="file" accept="image/*" onchange="previewAvatar(event)"><small class="muted">Elige una foto de tu dispositivo. No necesitas una URL.</small><label>Nombre de usuario</label><input id="eu" value="${esc(u.username)}"><label>Biografía</label><textarea id="eb">${esc(u.bio||'')}</textarea><button class="p" onclick="saveProfile()">Guardar cambios</button> <button class="g" onclick="my()">Cancelar</button></div>`}function previewAvatar(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('meBox').querySelector('.avatarPicker').innerHTML=`<img id="avatarPreview" src="${r.result}">`};r.readAsDataURL(f)}async function saveProfile(){let username=$('eu').value.trim().replace(/^@/,'').toLowerCase(),bio=$('eb').value.trim(),file=$('avatarFile').files?.[0];if(!username)return alert('Escribe un nombre de usuario.');if(!/^[a-z0-9_.]{2,30}$/.test(username))return alert('El usuario debe tener 2-30 caracteres: letras, números, _ o .');let dup=await db.from('profiles').select('id').eq('username',username).neq('id',me.id).maybeSingle();if(dup.error)return alert('No se pudo comprobar el nombre: '+dup.error.message);if(dup.data)return alert('Ese nombre de usuario ya está ocupado.');let avatar_url=null;if(file){if(!file.type.startsWith('image/'))return alert('Selecciona una imagen.');if(file.size>5*1024*1024)return alert('La imagen debe pesar menos de 5 MB.');let ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${me.id}/avatar.${ext}`;let up=await db.storage.from('avatars').upload(path,file,{contentType:file.type,upsert:true,cacheControl:'3600'});if(up.error)return alert('No se pudo subir la foto. En Supabase debe existir el bucket "avatars" y una política de INSERT/UPDATE para usuarios autenticados.');let pub=db.storage.from('avatars').getPublicUrl(path);avatar_url=pub.data.publicUrl+'?v='+Date.now()}let updates={username,bio};if(avatar_url)updates.avatar_url=avatar_url;let r=await db.from('profiles').update(updates).eq('id',me.id);if(r.error)return alert('No se pudieron guardar los cambios: '+r.error.message);my()}async function post(){let media_url=$('pv').value.trim(),media_type=$('pt').value,caption=$('pc').value.trim();if(!media_url)return alert('Pon una URL.');let r=await db.from('posts').insert({user_id:me.id,media_url,media_type,caption});if(r.error)return alert(r.error.message);go('feed')}async function like(id){if(guestMode)return;let q=await db.from('likes').select('post_id').eq('post_id',id).eq('user_id',me.id).maybeSingle();let r=q.data?await db.from('likes').delete().eq('post_id',id).eq('user_id',me.id):await db.from('likes').insert({post_id:id,user_id:me.id});if(r.error)alert(r.error.message);feed()}async function reels(){let{data,error}=await db.from('reels').select('id,video_url,caption,created_at,profiles(username,verified,avatar_url)').order('created_at',{ascending:false}).limit(50);$('reelList').innerHTML=error?`<div class="card">${esc(error.message)}</div>`:(data||[]).map(r=>`<article class="card"><div class="row">${av(r.profiles)}<b>${esc(r.profiles?.username||'Usuario')}${ver(r.profiles)}</b></div><video class="media" src="${esc(r.video_url)}" controls></video><p>${esc(r.caption)}</p></article>`).join('')||'<div class="card">No hay Reels.</div>'}async function reel(){let video_url=$('rv').value.trim(),caption=$('rc').value.trim();if(!video_url)return alert('Pon una URL de video.');let r=await db.from('reels').insert({user_id:me.id,video_url,caption});if(r.error)return alert(r.error.message);reels()}function logout(){db.auth.signOut();me=null;guestMode=false;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}db.auth.getSession().then(({data})=>{if(data.session){me=data.session.user;start()}});</script></body></html>

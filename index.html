<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DinoRamtix</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>:root{--b:#0095f6;--bg:#f5f6f8;--card:#fff;--t:#111;--m:#70757d;--bd:#e3e5e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px Arial,sans-serif}button,input,textarea,select{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.p{background:var(--b);color:white}.g{background:#eef0f3}.d{background:#ffe7e7;color:#a00}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:12px 0}.hidden{display:none!important}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.logo{font-size:25px;font-weight:900}header{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}nav{max-width:1000px;margin:auto;height:60px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.nav{display:flex;gap:4px}.nav button{background:none;font-size:20px}.auth{max-width:430px;margin:70px auto}.auth h1{font-size:34px;margin:0}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{flex:1}input,textarea,select{width:100%;padding:12px;border:1px solid #ccd0d5;border-radius:9px;margin:6px 0;background:#fff}textarea{min-height:90px}.muted{color:var(--m);font-size:14px}.verified{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#168df7;color:white;font-size:12px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffcf70,#e1306c,#833ab4);color:#fff;font-weight:800;font-size:20px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.feed{max-width:680px;margin:auto}.media{width:100%;max-height:720px;object-fit:cover;border-radius:12px;background:#111;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.comment{border-top:1px solid var(--bd);padding:7px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px}.guest{background:#fff7d8;border:1px solid #ead88b;padding:11px;border-radius:10px}.profile{display:flex;gap:20px;align-items:center}.profile .avatar{width:90px;height:90px;font-size:32px}.stat{display:flex;gap:18px;flex-wrap:wrap}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.nav button{font-size:18px}}
</style></head><body><header><nav><div class="logo">DinoRamtix 🦖</div><div id="nav" class="nav hidden"><button onclick="go('feed')">⌂</button><button onclick="go('explore')">⌕</button><button onclick="go('reels')">▶</button><button onclick="need('create')">＋</button><button onclick="go('me')">●</button></div></nav></header><main class="wrap"><section id="auth" class="card auth"><h1>DinoRamtix</h1><p class="muted">Comparte fotos, videos y Reels.</p><div class="tabs"><button id="lt" class="p" onclick="mode='login';tabs()">Iniciar sesión</button><button id="st" class="g" onclick="mode='signup';tabs()">Registrarme</button></div><input id="email" type="email" placeholder="Correo electrónico"><input id="pass" type="password" placeholder="Contraseña"><input id="user" class="hidden" placeholder="Nombre de usuario"><button id="authBtn" class="p" style="width:100%" onclick="auth()">Iniciar sesión</button><button class="g" style="width:100%;margin-top:8px" onclick="guest()">Continuar como invitado</button><p id="msg" class="muted"></p></section><section id="app" class="hidden"><div id="guest" class="guest hidden">👋 Modo invitado. Puedes explorar; inicia sesión para publicar, seguir y dar likes.</div><div class="tabs"><button class="g" onclick="go('feed')">Inicio</button><button class="g" onclick="go('explore')">Explorar</button><button class="g" onclick="go('reels')">Reels</button><button class="p" onclick="need('create')">＋ Publicar</button></div><section id="feed"><div id="feedList" class="feed"></div></section><section id="explore" class="hidden"><div class="card"><h2>Explorar</h2><input id="search" placeholder="Buscar usuario..." oninput="people()"></div><div id="peopleList"></div></section><section id="reels" class="hidden"><div id="reelForm" class="card"><h2>Nuevo Reel</h2><input id="rv" placeholder="URL directa del video"><input id="rc" placeholder="Descripción"><button class="p" onclick="reel()">Publicar Reel</button></div><div id="reelList"></div></section><section id="create" class="hidden"><div class="card"><h2>Nueva publicación</h2><input id="pv" placeholder="URL directa de imagen o video"><select id="pt"><option value="image">Imagen</option><option value="video">Video</option></select><textarea id="pc" placeholder="Descripción"></textarea><button class="p" onclick="post()">Publicar</button></div></section><section id="me" class="hidden"><div id="meBox"></div></section><section id="profile" class="hidden"><div id="profileBox"></div></section><button class="d" onclick="logout()">Cerrar sesión</button></section></main><script>
const cfg=window.DINORAMTIX_CONFIG;const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);let me=null,guestMode=false,mode='login';const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
function tabs(){$('user').classList.toggle('hidden',mode!=='signup');$('authBtn').textContent=mode==='login'?'Iniciar sesión':'Crear cuenta';$('lt').className=mode==='login'?'p':'g';$('st').className=mode==='signup'?'p':'g';$('msg').textContent=''}
function av(u){return `<div class="avatar">${u?.avatar_url?`<img src="${esc(u.avatar_url)}">`:esc((u?.username||'?')[0].toUpperCase())}</div>`}function ver(u){return u?.verified?'<span class="verified">✓</span>':''}
async function auth(){const email=$('email').value.trim(),password=$('pass').value,username=$('user').value.trim();if(!email||!password||(mode==='signup'&&!username)){ $('msg').textContent='Completa todos los campos.';return }$('authBtn').disabled=true;$('msg').textContent='Procesando...';let r;if(mode==='login')r=await db.auth.signInWithPassword({email,password});else r=await db.auth.signUp({email,password,options:{data:{username}}});if(r.error){$('msg').textContent=err(r.error);$('authBtn').disabled=false;return}if(mode==='signup'&&!r.data.session){$('msg').textContent='Cuenta creada. Si Email Confirmations está activo en Supabase, confirma el correo antes de entrar.';$('authBtn').disabled=false;return}me=r.data.user;await start()}
function err(e){let m=e?.message||'Error';if(/rate limit/i.test(m))return'Demasiados intentos. Espera unos minutos antes de volver a probar.';if(/invalid login/i.test(m))return'Correo o contraseña incorrectos.';return m}
async function start(){guestMode=false;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');$('guest').classList.add('hidden');const {data}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();if(data)me.profile=data;go('feed')}
function guest(){guestMode=true;me=null;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');$('guest').classList.remove('hidden');$('reelForm').classList.add('hidden');go('feed')}
function need(id){if(guestMode){$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('nav').classList.add('hidden');$('msg').textContent='Inicia sesión o regístrate para usar esta función.';return}go(id)}
function go(id){['feed','explore','reels','create','me','profile'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='feed')feed();if(id==='explore')people();if(id==='reels')reels();if(id==='me')my();}
async function feed(){const {data,error}=await db.from('posts').select('id,user_id,caption,media_url,media_type,likes_count,created_at,profiles(username,verified,avatar_url)').order('created_at',{ascending:false}).limit(50);if(error){$('feedList').innerHTML=`<div class="card">${esc(error.message)}</div>`;return}$('feedList').innerHTML=(data||[]).map(p=>`<article class="card"><div class="row">${av(p.profiles)}<div class="grow"><b>${esc(p.profiles?.username||'Usuario')} ${ver(p.profiles)}</b><div class="muted">${new Date(p.created_at).toLocaleString('es-CO')}</div></div><button class="g" onclick="profile('${p.user_id}')">Perfil</button></div>${p.media_type==='video'?`<video class="media" src="${esc(p.media_url)}" controls playsinline></video>`:`<img class="media" src="${esc(p.media_url)}">`}<p>${esc(p.caption)}</p><div class="actions"><button class="g" onclick="like('${p.id}')">❤️ ${p.likes_count||0}</button></div>${!guestMode?`<div class="row"><input id="c-${p.id}" placeholder="Comentario..."><button class="p" onclick="comment('${p.id}')">Enviar</button></div>`:''}<div id="cs-${p.id}"></div></article>`).join('')||'<div class="card">No hay publicaciones todavía.</div>';for(const p of data||[])comments(p.id)}
async function comments(id){const {data}=await db.from('comments').select('body,profiles(username,verified)').eq('post_id',id).order('created_at',{ascending:true}).limit(20);$('cs-'+id).innerHTML=(data||[]).map(c=>`<div class="comment"><b>${esc(c.profiles?.username||'Usuario')} ${ver(c.profiles)}</b> ${esc(c.body)}</div>`).join('')}
async function comment(id){if(guestMode)return need('feed');const body=$('c-'+id).value.trim();if(!body)return;const r=await db.from('comments').insert({post_id:id,user_id:me.id,body});if(r.error)alert(r.error.message);else{ $('c-'+id).value='';comments(id)}}
async function like(id){if(guestMode)return need('feed');const q=await db.from('likes').select('post_id').eq('post_id',id).eq('user_id',me.id).maybeSingle();let r=q.data?await db.from('likes').delete().eq('post_id',id).eq('user_id',me.id):await db.from('likes').insert({post_id:id,user_id:me.id});if(r.error)alert(r.error.message);feed()}
async function post(){const url=$('pv').value.trim(),caption=$('pc').value.trim(),type=$('pt').value;if(!url)return alert('Pon la URL del archivo.');const r=await db.from('posts').insert({user_id:me.id,media_url:url,media_type:type,caption});if(r.error)alert(r.error.message);else{$('pv').value='';$('pc').value='';go('feed')}}
async function people(){let q=$('search')?.value.trim()||'';let x=db.from('profiles').select('*').order('followers_count',{ascending:false}).limit(50);if(q)x=x.ilike('username','%'+q+'%');const {data,error}=await x;if(error){$('peopleList').innerHTML=`<div class="card">${esc(error.message)}</div>`;return}$('peopleList').innerHTML=(data||[]).map(u=>`<div class="card row">${av(u)}<div class="grow"><b>${esc(u.username)} ${ver(u)}</b><div class="muted">${u.followers_count||0} seguidores · ${u.following_count||0} siguiendo</div></div><button class="p" onclick="profile('${u.id}')">Ver perfil</button></div>`).join('')||'<div class="card">No encontramos usuarios.</div>'}
async function profile(id){const {data:u,error}=await db.from('profiles').select('*').eq('id',id).single();if(error)return alert(error.message);$('feed').classList.add('hidden');$('explore').classList.add('hidden');$('reels').classList.add('hidden');$('create').classList.add('hidden');$('me').classList.add('hidden');$('profile').classList.remove('hidden');let follow='';if(!guestMode&&me.id!==id){const f=await db.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',id).maybeSingle();follow=`<button class="${f.data?'g':'p'}" onclick="toggleFollow('${id}',${!!f.data})">${f.data?'Siguiendo':'Seguir'}</button>`}$('profileBox').innerHTML=`<div class="card"><div class="profile">${av(u)}<div class="grow"><h2>${esc(u.username)} ${ver(u)}</h2><div class="stat"><b>${u.followers_count||0} seguidores</b><b>${u.following_count||0} siguiendo</b></div><p class="muted">${u.verified?'Cuenta verificada':'Verificación automática al llegar a 10.000 seguidores.'}</p>${follow}</div></div></div><div id="pgrid" class="grid"></div>`;const {data:ps}=await db.from('posts').select('media_url,media_type').eq('user_id',id).order('created_at',{ascending:false});$('pgrid').innerHTML=(ps||[]).map(p=>p.media_type==='video'?`<video class="media" src="${esc(p.media_url)}" controls></video>`:`<img src="${esc(p.media_url)}">`).join('')||'<div class="card">Sin publicaciones.</div>'}
async function toggleFollow(id,following){const r=following?await db.from('follows').delete().eq('follower_id',me.id).eq('following_id',id):await db.from('follows').insert({follower_id:me.id,following_id:id});if(r.error)alert(r.error.message);profile(id)}
async function reels(){const {data,error}=await db.from('reels').select('id,user_id,video_url,caption,created_at,profiles(username,verified,avatar_url)').order('created_at',{ascending:false}).limit(50);if(error){$('reelList').innerHTML=`<div class="card">${esc(error.message)}</div>`;return}$('reelList').innerHTML=(data||[]).map(r=>`<article class="card"><div class="row">${av(r.profiles)}<b>${esc(r.profiles?.username||'Usuario')} ${ver(r.profiles)}</b></div><video class="media" src="${esc(r.video_url)}" controls playsinline></video><p>${esc(r.caption)}</p></article>`).join('')||'<div class="card">No hay Reels todavía.</div>'}
async function reel(){const video_url=$('rv').value.trim(),caption=$('rc').value.trim();if(!video_url)return alert('Pon la URL directa del video.');const r=await db.from('reels').insert({user_id:me.id,video_url,caption});if(r.error)alert(r.error.message);else{$('rv').value='';$('rc').value='';reels()}}
async function my(){if(!me)return;profile(me.id)}async function logout(){await db.auth.signOut();location.reload()}db.auth.getSession().then(async({data})=>{if(data.session){me=data.session.user;await start()}});db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')location.reload()});tabs();</script></body></html>

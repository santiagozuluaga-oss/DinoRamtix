<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DinoRamtix</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--blue:#0095f6;--bg:#f5f6f8;--card:#fff;--text:#111;--muted:#70757d;--border:#e3e5e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px}.primary{background:var(--blue);color:#fff}.ghost{background:#eef0f3}.danger{background:#ffe9e9;color:#b00020}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}nav{height:64px;max-width:1050px;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:24px;letter-spacing:-1px}.nav{display:flex;gap:4px}.nav button{background:transparent;font-size:20px;padding:9px}.wrap{max-width:1050px;margin:24px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.03)}.hidden{display:none!important}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffcf70,#e1306c,#833ab4);color:#fff;font-weight:800;font-size:20px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted);font-size:14px}.verified{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#168df7;color:#fff;font-size:12px;vertical-align:middle}.auth{max-width:440px;margin:70px auto}.auth h1{font-size:34px;margin:0 0 5px}.auth p{color:var(--muted)}input,textarea{width:100%;padding:12px;border:1px solid #cfd3d8;border-radius:10px;margin:6px 0;background:#fff}textarea{min-height:90px;resize:vertical}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.feed{max-width:680px;margin:auto}.post img,.post video{width:100%;max-height:720px;object-fit:cover;border-radius:12px;margin-top:12px;background:#111}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.comment{padding:7px 0;border-top:1px solid var(--border)}.profile{display:flex;gap:20px;align-items:center}.profile .avatar{width:92px;height:92px;font-size:32px}.stats{display:flex;gap:18px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.guestbar{background:#fff8df;border:1px solid #f1df9b;padding:10px 14px;border-radius:12px;margin-bottom:14px}.badge10{display:inline-flex;align-items:center;gap:6px;background:#e9f4ff;color:#0876d1;padding:6px 10px;border-radius:999px;font-weight:700;font-size:13px}.progress{height:8px;background:#e8ebef;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--blue)}.empty{text-align:center;padding:40px 15px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.profile{align-items:flex-start}.nav button{font-size:18px}.logo{font-size:20px}}
</style>
</head>
<body>
<header><nav><div class="logo">DinoRamtix 🦖</div><div id="nav" class="nav hidden"><button title="Inicio" onclick="show('feed')">⌂</button><button title="Explorar" onclick="show('explore')">⌕</button><button title="Reels" onclick="show('reels')">▶</button><button title="Crear" onclick="show('create')">＋</button><button title="Perfil" onclick="show('me')">●</button></div></nav></header>
<main class="wrap">
<section id="auth" class="card auth">
  <h1>DinoRamtix</h1><p>Una red social para compartir fotos, videos y Reels.</p>
  <div class="tabs"><button id="loginTab" class="primary" onclick="authMode('login')">Iniciar sesión</button><button id="signupTab" class="ghost" onclick="authMode('signup')">Registrarme</button></div>
  <input id="email" type="email" autocomplete="email" placeholder="Correo electrónico">
  <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
  <input id="username" autocomplete="username" placeholder="Usuario (solo al registrarte)" class="hidden">
  <button id="authBtn" class="primary" style="width:100%" onclick="submitAuth()">Iniciar sesión</button>
  <button class="ghost" style="width:100%;margin-top:8px" onclick="enterGuest()">Continuar como invitado</button>
  <p id="authMsg" class="muted"></p>
</section>

<section id="app" class="hidden">
  <div id="guestBar" class="guestbar hidden">👋 Estás navegando como <b>invitado</b>. Puedes ver perfiles, publicaciones y Reels. <button class="primary" onclick="showAuth()">Iniciar sesión</button></div>
  <div class="tabs">
    <button class="ghost" onclick="show('feed')">Inicio</button><button class="ghost" onclick="show('explore')">Explorar</button><button class="ghost" onclick="show('reels')">Reels</button><button id="createBtn" class="primary" onclick="requireAuth('create')">＋ Publicar</button>
  </div>
  <section id="feed"><div class="feed" id="feedList"></div></section>
  <section id="explore" class="hidden"><div class="card"><div class="section-title"><h2>Explorar personas</h2><span class="muted">Busca usuarios</span></div><input id="search" placeholder="Buscar @usuario..." oninput="loadPeople()"></div><div id="people"></div></section>
  <section id="reels" class="hidden"><div class="section-title"><h2>Reels</h2><span class="muted">Videos verticales</span></div><div id="reelCreate" class="card hidden"><input id="reelUrl" placeholder="URL directa del video"><input id="reelCaption" placeholder="Descripción"><button class="primary" onclick="createReel()">Publicar Reel</button></div><div id="reelList"></div></section>
  <section id="create" class="hidden"><div class="card"><h2>Nueva publicación</h2><input id="postUrl" placeholder="URL directa de imagen o video"><select id="postType" style="width:100%;padding:11px;border:1px solid #cfd3d8;border-radius:10px"><option value="image">Imagen</option><option value="video">Video</option></select><textarea id="postCaption" placeholder="Escribe algo..."></textarea><button class="primary" onclick="createPost()">Publicar</button></div></section>
  <section id="me" class="hidden"><div id="myProfile"></div></section>
  <section id="profile" class="hidden"><div id="profileBox"></div></section>
  <button class="danger" onclick="logout()">Cerrar sesión</button>
</section>
</main>
<script>
const cfg=window.DINORAMTIX_CONFIG;const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);let me=null,guest=false,mode='login';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function authMode(m){mode=m;$('username').classList.toggle('hidden',m!=='signup');$('authBtn').textContent=m==='login'?'Iniciar sesión':'Crear cuenta';$('loginTab').className=m==='login'?'primary':'ghost';$('signupTab').className=m==='signup'?'primary':'ghost';$('authMsg').textContent='';}
function showAuth(){guest=false;$('app').classList.add('hidden');$('nav').classList.add('hidden');$('auth').classList.remove('hidden');authMode('login');}
function enterGuest(){guest=true;me=null;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');$('guestBar').classList.remove('hidden');$('createBtn').classList.add('hidden');$('reelCreate').classList.add('hidden');show('feed');}
async function submitAuth(){const email=$('email').value.trim(),password=$('password').value,username=$('username').value.trim();if(!email||!password||(mode==='signup'&&!username)){return $('authMsg').textContent='Completa todos los campos.';}$('authBtn').disabled=true;$('authMsg').textContent='Procesando...';if(mode==='login'){const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){$('authMsg').textContent=prettyAuthError(error);$('authBtn').disabled=false;return;}me=data.user;await start();}else{const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});if(error){$('authMsg').textContent=prettyAuthError(error);$('authBtn').disabled=false;return;}if(data.session){me=data.user;await start();}else{$('authMsg').textContent='Cuenta creada. Si tu proyecto tiene confirmación de email activada, debes confirmarla antes de iniciar sesión.';}$('authBtn').disabled=false;}}
function prettyAuthError(e){const m=e?.message||'Error de autenticación';if(m.toLowerCase().includes('rate limit'))return 'Demasiados intentos. Espera unos minutos y vuelve a probar.';if(m.toLowerCase().includes('invalid login'))return 'Correo o contraseña incorrectos.';return m;}
async function start(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');$('guestBar').classList.add('hidden');$('createBtn').classList.remove('hidden');$('reelCreate').classList.remove('hidden');const {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(data)me.profile=data;show('feed');}
function requireAuth(target){if(guest){showAuth();$('authMsg').textContent='Inicia sesión o regístrate para publicar e interactuar.';return;}show(target);}
function show(id){['feed','explore','reels','create','me','profile'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='feed')loadFeed();if(id==='explore')loadPeople();if(id==='reels')loadReels();if(id==='me')loadMyProfile();}
function badge(u){return u?.verified?'<span class="verified">✓</span>':''}
function avatar(u,size='48'){const letter=esc((u?.username||'?')[0].toUpperCase());return `<div class="avatar" style="width:${size}px;height:${size}px">${u?.avatar_url?`<img src="${esc(u.avatar_url)}">`:letter}</div>`}
async function loadFeed(){const {data,error}=await sb.from('posts').select('id,caption,media_url,media_type,likes_count,created_at,user_id,profiles(username,verified,avatar_url)').order('created_at',{ascending:false}).limit(50);if(error){$('feedList').innerHTML=`<div class="card">${esc(error.message)}</div>`;return;}$('feedList').innerHTML=(data||[]).map(p=>`<article class="card post"><div class="row">${avatar(p.profiles)}<div class="grow"><b>${esc(p.profiles?.username||'Usuario')} ${badge(p.profiles)}</b><div class="muted">${new Date(p.created_at).toLocaleString('es-CO')}</div></div></div>${p.media_type==='video'?`<video src="${esc(p.media_url)}" controls playsinline></video>`:`<img src="${esc(p.media_url)}" loading="lazy">`}<p>${esc(p.caption)}</p><div class="actions"><button class="ghost" onclick="likePost('${p.id}')">❤️ ${p.likes_count||0}</button><button class="ghost" onclick="openProfile('${p.user_id}')">Ver perfil</button></div><div id="comments-${p.id}"></div>${!guest?`<div class="row" style="margin-top:8px"><input id="comment-${p.id}" placeholder="Añade un comentario..."><button class="primary" onclick="addComment('${p.id}')">Enviar</button></div>`:''}</article>`).join('')||'<div class="card empty">Todavía no hay publicaciones.</div>';for(const p of (data||[]))loadComments(p.id);}
async function loadComments(id){const {data}=await sb.from('comments').select('body,created_at,profiles(username,verified)').eq('post_id',id).order('created_at',{ascending:true}).limit(20);const el=$('comments-'+id);if(!el)return;el.innerHTML=(data||[]).map(c=>`<div class="comment"><b>${esc(c.profiles?.username||'Usuario')} ${badge(c.profiles)}</b> ${esc(c.body)}</div>`).join('');}
async function addComment(postId){if(guest)return requireAuth('feed');const input=$('comment-'+postId),body=input.value.trim();if(!body)return;const {error}=await sb.from('comments').insert({post_id:postId,user_id:me.id,body});if(error)return alert(error.message);input.value='';loadComments(postId);}
async function likePost(id){if(guest)return requireAuth('feed');const {data}=await sb.from('likes').select('post_id').eq('post_id',id).eq('user_id',me.id).maybeSingle();const result=data?await sb.from('likes').delete().eq('post_id',id).eq('user_id',me.id):await sb.from('likes').insert({post_id:id,user_id:me.id});if(result.error)alert(result.error.message);loadFeed();}
async function createPost(){if(guest)return requireAuth('create');const url=$('postUrl').value.trim(),caption=$('postCaption').value.trim(),media_type=$('postType').value;if(!url)return alert('Pon una URL directa.');const {error}=await sb.from('posts').insert({user_id:me.id,media_url:url,caption,media_type});if(error)return alert(error.message);$('postUrl').value='';$('postCaption').value='';show('feed');}
async function loadPeople(){const q=$('search').value.trim();let query=sb.from('profiles').select('*').order('followers_count',{ascending:false}).limit(50);if(q)query=query.ilike('username','%'+q+'%');const {data,error}=await query;if(error)return $('people').innerHTML=`<div class="card">${esc(error.message)}</div>`;$('people').innerHTML=(data||[]).map(u=>`<div class="card row">${avatar(u)}<div class="grow"><b>${esc(u.username)} ${badge(u)}</b><div class="muted">${u.followers_count||0} seguidores · ${u.following_count||0} siguiendo</div></div><button class="primary" onclick="openProfile('${u.id}')">Ver perfil</button></div>`).join('')||'<div class="card empty">No encontramos usuarios.</div>';}
async function openProfile(id){const {data:u}=await sb.from('profiles').select('*').eq('id',id).single();if(!u)return;const {data:posts}=await sb.from('posts').select('*').eq('user_id',id).order('created_at',{ascending:false});const following=me&&!guest?(await sb.from('follows').select('following_id').eq('follower_id',me.id).eq('following_id',id).maybeSingle()).data:null;const progress=Math.min(100,((u.followers_count||0)/10000)*100);$('profileBox').innerHTML=`<div class="card"><div class="profile">${avatar(u,'92')}<div class="grow"><h2 style="margin:0">${esc(u.username)} ${badge(u)}</h2><div class="stats"><b>${u.followers_count||0} seguidores</b><b>${u.following_count||0} siguiendo</b></div><p>${esc(u.bio||'')}</p>${u.followers_count<10000?`<div class="muted">Camino a la verificación: ${u.followers_count||0.toLocaleString('es-CO')} / 10.000</div><div class="progress"><div style="width:${progress}%"></div></div>`:'<span class="badge10">✓ Verificado por 10.000 seguidores</span>'}</div></div>${(!guest&&me.id!==id)?`<div class="actions"><button class="primary" onclick="toggleFollow('${id}')">${following?'Dejar de seguir':'Seguir'}</button></div>`:''}</div><div class="grid">${(posts||[]).map(p=>`<img src="${esc(p.media_url)}" loading="lazy">`).join('')}</div>`;show('profile');}
async function toggleFollow(id){if(guest)return requireAuth('profile');const {data}=await sb.from('follows').select('following_id').eq('follower_id',me.id).eq('following_id',id).maybeSingle();const result=data?await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',id):await sb.from('follows').insert({follower_id:me.id,following_id:id});if(result.error)return alert(result.error.message);openProfile(id);}
async function loadMyProfile(){const {data:u}=await sb.from('profiles').select('*').eq('id',me.id).single();const {data:posts}=await sb.from('posts').select('*').eq('user_id',me.id).order('created_at',{ascending:false});const progress=Math.min(100,((u.followers_count||0)/10000)*100);$('myProfile').innerHTML=`<div class="card"><div class="profile">${avatar(u,'92')}<div class="grow"><h2 style="margin:0">${esc(u.username)} ${badge(u)}</h2><div class="stats"><b>${u.followers_count||0} seguidores</b><b>${u.following_count||0} siguiendo</b></div><p>${esc(u.bio||'')}</p>${u.verified?'<span class="badge10">✓ Cuenta verificada</span>':`<div class="muted">${(u.followers_count||0).toLocaleString('es-CO')} / 10.000 seguidores para verificar</div><div class="progress"><div style="width:${progress}%"></div></div>`}</div></div></div><div class="grid">${(posts||[]).map(p=>`<img src="${esc(p.media_url)}" loading="lazy">`).join('')}</div>`;}
async function loadReels(){const {data,error}=await sb.from('reels').select('id,caption,video_url,likes_count,created_at,user_id,profiles(username,verified,avatar_url)').order('created_at',{ascending:false}).limit(50);if(error){$('reelList').innerHTML=`<div class="card">${esc(error.message)}</div>`;return;}$('reelList').innerHTML=(data||[]).map(r=>`<article class="card post"><div class="row">${avatar(r.profiles)}<div><b>${esc(r.profiles?.username||'Usuario')} ${badge(r.profiles)}</b><div class="muted">${new Date(r.created_at).toLocaleString('es-CO')}</div></div></div><video src="${esc(r.video_url)}" controls loop playsinline></video><p>${esc(r.caption)}</p><button class="ghost">▶ Reel</button></article>`).join('')||'<div class="card empty">Todavía no hay Reels.</div>';}
async function createReel(){if(guest)return requireAuth('reels');const video_url=$('reelUrl').value.trim(),caption=$('reelCaption').value.trim();if(!video_url)return alert('Pon la URL directa del video.');const {error}=await sb.from('reels').insert({user_id:me.id,video_url,caption});if(error)return alert(error.message);$('reelUrl').value='';$('reelCaption').value='';loadReels();}
async function logout(){await sb.auth.signOut();location.reload();}
sb.auth.onAuthStateChange((_event,session)=>{if(session&&!me){me=session.user;start();}});sb.auth.getSession().then(({data})=>{if(data.session){me=data.session.user;start();}});
</script>
</body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DinoRamtix</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>body{font-family:Arial;margin:0;background:#fafafa;color:#111}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px;z-index:2}nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:24px;font-weight:800}main{max-width:900px;margin:25px auto;padding:0 14px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer}button.primary{background:#0095f6;color:white}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px;margin:6px 0}.hidden{display:none}.avatar{width:65px;height:65px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffdc80,#e1306c,#833ab4);color:#fff;font-size:28px;font-weight:bold}.row{display:flex;gap:12px;align-items:center}.verified{display:inline-grid;place-items:center;background:#3897f0;color:white;width:19px;height:19px;border-radius:50%;font-size:12px}.postimg{width:100%;max-height:600px;object-fit:cover;border-radius:9px}.navbtn{background:none;font-size:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{background:#eee}.profile{display:flex;gap:25px;align-items:center}.muted{color:#777;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover}@media(max-width:600px){.profile{align-items:flex-start}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><nav><div class="logo">DinoRamtix 🦖</div><div><button class="navbtn" onclick="show('feed')">⌂</button><button class="navbtn" onclick="show('explore')">⌕</button><button class="navbtn" onclick="show('reels')">▶</button><button class="navbtn" onclick="show('create')">＋</button><button class="navbtn" onclick="show('me')">●</button></div></nav></header><main><section id="auth" class="card"><h2>Iniciar sesión</h2><input id="email" placeholder="Correo electrónico"><input id="password" type="password" placeholder="Contraseña"><input id="username" placeholder="Usuario (solo al registrarte)"><div class="tabs"><button class="primary" onclick="login()">Iniciar sesión</button><button onclick="signup()">Registrarse</button></div><p id="authMsg" class="muted"></p></section><div id="app" class="hidden"><section id="feed"><div id="feedList"></div></section><section id="explore" class="hidden"><div class="card"><h2>Explorar personas</h2><input id="search" placeholder="Buscar usuario..." oninput="loadPeople()"></div><div id="people"></div></section><section id="reels" class="hidden"><div class="card"><h2>Reels</h2><input id="reelUrl" placeholder="URL del video"><input id="reelCaption" placeholder="Descripción"><button class="primary" onclick="createReel()">Publicar Reel</button></div><div id="reelList"></div></section><section id="create" class="hidden"><div class="card"><h2>Nueva publicación</h2><input id="postUrl" placeholder="URL de imagen"><textarea id="postCaption" placeholder="Escribe algo..."></textarea><button class="primary" onclick="createPost()">Publicar</button></div></section><section id="me" class="hidden"><div id="myProfile"></div></section><section id="profile" class="hidden"><div id="profileBox"></div></section><button onclick="logout()">Cerrar sesión</button></div></main><script>const cfg=window.DINORAMTIX_CONFIG;const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);let me=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function show(id){['feed','explore','reels','create','me','profile'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='feed')loadFeed();if(id==='explore')loadPeople();if(id==='reels')loadReels();if(id==='me')loadMyProfile();}async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)return $("authMsg").textContent=error.message;me=data.user;start();}async function signup(){const email=$("email").value,password=$("password").value,username=$("username").value.trim();if(!email||!password||!username)return $("authMsg").textContent='Completa correo, contraseña y usuario.';const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});if(error)return $("authMsg").textContent=error.message;$("authMsg").textContent='Cuenta creada. Si aparece confirmación por correo, confírmala y vuelve a iniciar sesión.';}async function logout(){await sb.auth.signOut();location.reload()}async function start(){ $("auth").classList.add('hidden');$("app").classList.remove('hidden');show('feed');const {data}=await sb.from('profiles').select('*').eq('id',me.id).single();if(data)me.profile=data;}async function loadFeed(){const {data,error}=await sb.from('posts').select('id,caption,media_url,media_type,likes_count,created_at,user_id,profiles(username,verified)').order('created_at',{ascending:false});if(error)return $("feedList").innerHTML='<div class="card">'+esc(error.message)+'</div>';$("feedList").innerHTML=(data||[]).map(p=>`<article class="card"><div class="row"><div class="avatar">${esc((p.profiles?.username||'?')[0].toUpperCase())}</div><div><b>${esc(p.profiles?.username||'Usuario')} ${p.profiles?.verified?'<span class="verified">✓</span>':''}</b><div class="muted">${new Date(p.created_at).toLocaleString()}</div></div></div><img class="postimg" src="${esc(p.media_url)}"><p>${esc(p.caption)}</p><button onclick="likePost('${p.id}')">❤️ ${p.likes_count}</button><button onclick="openProfile('${p.user_id}')">Ver perfil</button></article>`).join('')||'<div class="card">Todavía no hay publicaciones.</div>';}async function createPost(){const url=$("postUrl").value.trim(),caption=$("postCaption").value.trim();if(!url)return alert('Pon una URL de imagen.');const {error}=await sb.from('posts').insert({user_id:me.id,media_url:url,caption,media_type:'image'});if(error)return alert(error.message);$("postUrl").value='';$("postCaption").value='';show('feed');}async function likePost(id){const {data}=await sb.from('likes').select('post_id').eq('post_id',id).eq('user_id',me.id).maybeSingle();if(data)await sb.from('likes').delete().eq('post_id',id).eq('user_id',me.id);else await sb.from('likes').insert({post_id:id,user_id:me.id});await sb.from('posts').select('id');loadFeed();}async function loadPeople(){const q=$("search").value.trim();let query=sb.from('profiles').select('*').order('followers_count',{ascending:false}).limit(50);if(q)query=query.ilike('username','%'+q+'%');const {data,error}=await query;if(error)return $("people").innerHTML=esc(error.message);$("people").innerHTML=(data||[]).map(u=>`<div class="card row"><div class="avatar">${esc((u.username||'?')[0].toUpperCase())}</div><div style="flex:1"><b>${esc(u.username)} ${u.verified?'<span class="verified">✓</span>':''}</b><div class="muted">${u.followers_count} seguidores · ${esc(u.bio||'')}</div></div><button class="primary" onclick="openProfile('${u.id}')">Ver perfil</button></div>`).join('');}async function openProfile(id){const {data:u}=await sb.from('profiles').select('*').eq('id',id).single();if(!u)return;const {data:posts}=await sb.from('posts').select('*').eq('user_id',id).order('created_at',{ascending:false});$("profileBox").innerHTML=`<div class="card profile"><div class="avatar">${esc((u.username||'?')[0].toUpperCase())}</div><div><h2>${esc(u.username)} ${u.verified?'<span class="verified">✓</span>':''}</h2><p>${u.followers_count} seguidores · ${u.following_count} siguiendo</p><p>${esc(u.bio||'')}</p><button class="primary" onclick="toggleFollow('${u.id}')">Seguir / dejar de seguir</button></div></div><div class="grid">${(posts||[]).map(p=>`<img src="${esc(p.media_url)}">`).join('')}</div>`;show('profile');}async function toggleFollow(id){if(id===me.id)return;const {data}=await sb.from('follows').select('following_id').eq('follower_id',me.id).eq('following_id',id).maybeSingle();if(data)await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',id);else await sb.from('follows').insert({follower_id:me.id,following_id:id});openProfile(id);}async function loadMyProfile(){const {data:u}=await sb.from('profiles').select('*').eq('id',me.id).single();const {data:posts}=await sb.from('posts').select('*').eq('user_id',me.id).order('created_at',{ascending:false});$("myProfile").innerHTML=`<div class="card profile"><div class="avatar">D</div><div><h2>${esc(u.username)} ${u.verified?'<span class="verified">✓</span>':''}</h2><p>${u.followers_count} seguidores · ${u.following_count} siguiendo</p><p>${esc(u.bio||'')}</p></div></div><div class="grid">${(posts||[]).map(p=>`<img src="${esc(p.media_url)}">`).join('')}</div>`;}async function loadReels(){const {data,error}=await sb.from('reels').select('id,caption,video_url,likes_count,created_at,profiles(username,verified)').order('created_at',{ascending:false});if(error)return $("reelList").innerHTML=esc(error.message);$("reelList").innerHTML=(data||[]).map(r=>`<article class="card"><b>${esc(r.profiles?.username||'Usuario')} ${r.profiles?.verified?'<span class="verified">✓</span>':''}</b><video src="${esc(r.video_url)}" controls loop playsinline style="width:100%;max-height:700px;margin-top:10px;background:#111"></video><p>${esc(r.caption)}</p><button>❤️ ${r.likes_count}</button></article>`).join('')||'<div class="card">Todavía no hay Reels.</div>';}async function createReel(){const video_url=$("reelUrl").value.trim(),caption=$("reelCaption").value.trim();if(!video_url)return alert('Pon la URL del video.');const {error}=await sb.from('reels').insert({user_id:me.id,video_url,caption});if(error)return alert(error.message);$("reelUrl").value='';$("reelCaption").value='';loadReels();}sb.auth.getSession().then(({data})=>{if(data.session){me=data.session.user;start();}});</script></body></html>
